name: Verifica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test, lint e tipi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  installazione:
    # Prova l'installazione con un solo comando, come la farebbe un amico: scarica Node.js e l'app,
    # compila, avvia e controlla che il server risponda.
    name: Installazione su ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FANTA_REF: ${{ github.sha }}
      FANTA_SCARICA_NODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Installa e avvia (Mac e Linux)
        if: runner.os != 'Windows'
        run: |
          export FANTA_DIR="$RUNNER_TEMP/FantaIntelligence"
          nohup bash scripts/installa.sh > "$RUNNER_TEMP/installa.log" 2>&1 &
          for i in $(seq 1 200); do
            if curl -fs http://127.0.0.1:3000/api/health; then break; fi
            sleep 5
          done
          cat "$RUNNER_TEMP/installa.log"
          curl -fs http://127.0.0.1:3000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/setup)" = "200"
          "$FANTA_DIR/.node/bin/node" -v

      - name: Installa e avvia (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:FANTA_DIR = Join-Path $env:RUNNER_TEMP 'FantaIntelligence'
          $log = Join-Path $env:RUNNER_TEMP 'installa.log'
          $err = Join-Path $env:RUNNER_TEMP 'installa.err'
          $cmd = 'Get-Content -Raw scripts\installa.ps1 | Invoke-Expression'
          Start-Process powershell -ArgumentList '-NoProfile', '-Command', $cmd -RedirectStandardOutput $log -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 200 -and -not $ok; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:3000/api/health -TimeoutSec 3 | Out-Null; $ok = $true } catch { Start-Sleep 5 }
          }
          Get-Content $log, $err -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'Il server non risponde' }
          Invoke-RestMethod http://127.0.0.1:3000/api/health
          $setup = Invoke-WebRequest http://127.0.0.1:3000/setup -UseBasicParsing
          if ($setup.StatusCode -ne 200) { throw "setup: $($setup.StatusCode)" }
          & (Join-Path $env:FANTA_DIR '.node\node.exe') -v
